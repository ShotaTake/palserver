name: CI

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  server-python310:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up server Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # The server helper is standalone; installing the Pi bot would require 3.11.
      - name: Install server test dependencies
        run: python -m pip install 'pytest>=8,<9'

      - name: Test server maintenance on Python 3.10
        run: python -m pytest -q -c /dev/null tests/test_maintenance_server.py

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy src

      - name: Pytest
        run: pytest
